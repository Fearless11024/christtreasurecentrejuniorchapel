<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Chat · Junior Chapel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
      <h1 style="color:var(--blue-deep);margin:0;">Teacher Chat</h1>
      <a class="btn btn-outline" href="dashboard.html">&larr; Dashboard</a>
    </div>

    <div class="pill-row" id="room-tabs" style="margin-bottom:16px;"></div>

    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;">
      <div class="card" style="flex:2;min-width:280px;padding:0;overflow:hidden;display:flex;flex-direction:column;height:520px;">
        <div id="chat-messages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;"></div>
        <form id="chat-form" style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);">
          <input type="text" id="chat-input" placeholder="Type a message..." style="margin:0;flex:1;" autocomplete="off" />
          <button type="submit" class="btn btn-primary">Send</button>
        </form>
      </div>

      <div class="card" style="flex:1;min-width:200px;">
        <div class="eyebrow">Online Now</div>
        <div id="online-list"></div>
      </div>
    </div>
  </main>

  <footer>Christ Treasure Centre · Junior Chapel</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/branches.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
