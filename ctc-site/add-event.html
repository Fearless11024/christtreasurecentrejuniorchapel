<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Event · Junior Chapel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main style="max-width:480px;">
    <h1 style="color:var(--blue-deep);margin-bottom:20px;">Add a Programme / Event</h1>

    <form id="event-form" class="card">
      <label for="ev-title">Title *</label>
      <input type="text" id="ev-title" required placeholder="e.g. Children's Christmas Carol Night" />

      <label for="ev-branch">Branch</label>
      <select id="ev-branch">
        <option value="">All branches</option>
      </select>

      <label for="ev-date">Date *</label>
      <input type="date" id="ev-date" required />

      <label for="ev-time">Time (optional)</label>
      <input type="text" id="ev-time" placeholder="e.g. 4:00 PM" />

      <label for="ev-description">Description</label>
      <textarea id="ev-description" rows="4" placeholder="What's happening, what to bring, etc."></textarea>

      <div class="error-text" id="error" style="display:none;"></div>

      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;" id="submit-btn">
          Publish Event
        </button>
        <a href="events.html" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </main>

  <footer>Christ Treasure Centre · Junior Chapel</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/branches.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/add-event.js"></script>
</body>
</html>
