<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile · Junior Chapel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main style="max-width:440px;">
    <h1 style="color:var(--blue-deep);margin-bottom:20px;">My Profile</h1>

    <form id="profile-form" class="card">
      <label for="email-display">Email</label>
      <input type="text" id="email-display" disabled style="background:var(--page);" />

      <label for="nickname">Nickname</label>
      <input type="text" id="nickname" placeholder="What should other teachers call you?" />
      <p class="field-note">Shown in chat and calls instead of your email.</p>

      <label>Birthday (optional)</label>
      <div style="display:flex;gap:10px;">
        <select id="birth-month" style="flex:1;"></select>
        <select id="birth-day" style="flex:1;"></select>
      </div>
      <p class="field-note">Only month/day are stored — no year. Shown in the staff birthday shoutout.</p>

      <div class="error-text" id="error" style="display:none;"></div>
      <div class="status-text" id="status" style="display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="submit-btn">
        Save Profile
      </button>
    </form>
  </main>

  <footer>Christ Treasure Centre · Junior Chapel</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
