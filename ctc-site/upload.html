<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload a Lesson · Junior Chapel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main style="max-width:520px;">
    <h1 style="color:var(--blue-deep);margin-bottom:20px;">Upload a Lesson</h1>

    <form id="upload-form" class="card">
      <label>Branch</label>
      <div id="branch-display" class="viewing-bar" style="margin-bottom:16px;"></div>
      <select id="branch" style="display:none;"></select>

      <label for="class">Class</label>
      <select id="class"></select>

      <label for="title">Title *</label>
      <input type="text" id="title" required />

      <label for="scripture">Scripture reference</label>
      <input type="text" id="scripture" placeholder="e.g. John 3:16" />

      <label for="description">Description</label>
      <textarea id="description" rows="4"></textarea>

      <label>Video</label>
      <div class="radio-row">
        <label><input type="radio" name="video-mode" value="youtube" checked /> YouTube link</label>
        <label><input type="radio" name="video-mode" value="upload" /> Upload video file</label>
        <label><input type="radio" name="video-mode" value="none" /> No video</label>
      </div>
      <input type="url" id="youtube-url" placeholder="https://youtube.com/watch?v=..." />
      <input type="file" id="video-file" accept="video/*" style="display:none;margin-bottom:16px;" />
      <p class="field-note" id="video-note">Max 200MB. For longer videos, use a YouTube link instead.</p>

      <label for="attachments">Attachments (PDF, Word, Excel, PowerPoint, WPS)</label>
      <input
        type="file"
        id="attachments"
        multiple
        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.wps,.wpt,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation"
      />
      <p class="field-note">Max 25MB each.</p>

      <div class="error-text" id="error" style="display:none;"></div>
      <div class="status-text" id="status" style="display:none;"></div>

      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;" id="submit-btn">
          Publish Lesson
        </button>
        <a href="dashboard.html" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </main>

  <footer>Christ Treasure Centre · Junior Chapel</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/branches.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
