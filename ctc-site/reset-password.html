<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password · Junior Chapel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main style="max-width:400px;">
    <h1 style="color:var(--blue-deep);margin-bottom:4px;">Set a New Password</h1>
    <p style="color:var(--ink-soft);font-size:14px;margin-bottom:24px;" id="intro-text">
      Checking your reset link...
    </p>

    <form id="reset-form" class="card" style="display:none;">
      <label for="password">New password</label>
      <div class="password-field">
        <input type="password" id="password" required minlength="6" />
        <button type="button" id="toggle-password" aria-label="Show password">👁️</button>
      </div>
      <div class="error-text" id="error" style="display:none;"></div>
      <div class="status-text" id="status" style="display:none;"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="submit-btn">
        Set new password
      </button>
    </form>
  </main>

  <footer>Christ Treasure Centre · Junior Chapel</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
